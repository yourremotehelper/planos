<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escáner a plano</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <header class="barra">
    <h1>Escáner a plano</h1>
    <span class="paso" id="nombreEscaneo">Paso 3 · Ver la planta</span>
    <div class="acciones oculto" id="accionesVisor">
      <button class="botonBarra" id="btnEncajar" title="Ver la planta entera">Encajar</button>
      <button class="botonBarra" id="btnInfo" title="Datos del escaneo">Datos</button>
      <button class="botonBarra" id="btnOtro" title="Abrir otro escaneo">Abrir otro</button>
    </div>
  </header>

  <!-- Pantallas de carga -->
  <main class="contenido" id="pantallaCarga">
    <section class="tarjeta" id="zonaCarga">
      <h2>Abrir nube de puntos</h2>
      <p class="ayuda">Archivo <strong>.ply</strong> exportado de RayStudio (nube de puntos, no malla).</p>

      <label class="boton" for="archivo">Elegir archivo .ply</label>
      <input type="file" id="archivo" accept=".ply" hidden>

      <div class="soltar" id="soltar">o arrástralo aquí</div>
    </section>

    <section class="tarjeta oculto" id="zonaProgreso">
      <h2 id="nombreArchivo">Leyendo…</h2>
      <div class="barraProgreso"><div id="progreso"></div></div>
      <p class="ayuda" id="textoProgreso">0 %</p>
    </section>

    <section class="tarjeta error oculto" id="zonaError">
      <h2>No se ha podido leer el archivo</h2>
      <p id="textoError"></p>
      <button class="boton secundario" id="reintentar">Probar con otro archivo</button>
    </section>
  </main>

  <!-- Visor de la planta -->
  <section class="visor oculto" id="pantallaVisor">
    <canvas id="lienzo"></canvas>

    <div class="panelHerramientas">
      <div class="grupo">
        <button class="herramienta" id="btnMedir" aria-pressed="false">📏 Medir</button>
        <button class="herramienta interruptor activo" id="btnIman" aria-pressed="true" title="Engancha los puntos a paredes y esquinas">🧲 Imán</button>
      </div>
      <div class="grupo oculto" id="grupoCotas">
        <button class="herramienta" id="btnDeshacer" title="Quitar la última cota (Ctrl+Z)">↶ Deshacer</button>
        <button class="herramienta" id="btnBorrarCotas">Borrar cotas</button>
      </div>
      <p class="pista oculto" id="pistaMedir">Pincha en el primer punto…</p>
    </div>

    <div class="escalaGrafica" id="escalaGrafica">
      <div class="regla" id="regla"></div>
      <span id="textoEscala">1 m</span>
    </div>

    <div class="panelCorte">
      <label for="alturaCorte">Altura del corte</label>
      <input type="range" id="alturaCorte" min="0.1" max="2.8" step="0.01" value="1.1">
      <span class="campoNumero">
        <input type="text" id="valorCorte" inputmode="decimal" value="1,10" aria-label="Altura del corte en metros">
        <span>m</span>
      </span>
    </div>

    <aside class="panelInfo oculto" id="panelInfo">
      <button class="cerrar" id="cerrarInfo" aria-label="Cerrar">×</button>
      <h3>Escaneo</h3>
      <dl class="datos" id="datos"></dl>
      <h3>Ajuste automático</h3>
      <dl class="datos" id="ajuste"></dl>
      <p class="aviso oculto" id="avisoSuelo"></p>
    </aside>
  </section>

  <script src="js/visor.js"></script>
  <script src="js/medir.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
